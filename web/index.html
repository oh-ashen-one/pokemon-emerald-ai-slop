<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokemon Emerald: AI Slop</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: radial-gradient(circle at 50% 0%, #161d2e 0%, #0b0e14 60%);
      color: #e6e6e6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 18px 14px;
      gap: 14px;
    }
    header { text-align: center; }
    header h1 {
      margin: 0;
      font-size: clamp(18px, 3vw, 26px);
      letter-spacing: 0.5px;
    }
    header .tag {
      margin: 4px 0 0;
      font-size: 12px;
      color: #7c8aa5;
    }

    /* The highlighted card. Width is driven by available height so the
       3:2 game canvas fits with no empty black band underneath. */
    .card {
      width: min(92vw, calc((100vh - 200px) * 1.5), 900px);
      background: #11161f;
      border: 1px solid #2a3346;
      border-radius: 16px;
      padding: 12px;
      box-shadow:
        0 0 0 1px rgba(86, 130, 220, 0.15),
        0 10px 40px rgba(0, 0, 0, 0.55),
        0 0 60px rgba(70, 120, 230, 0.18);
    }
    /* Game canvas: locked to GBA 3:2 so EmulatorJS fills it exactly. */
    #game {
      width: 100%;
      aspect-ratio: 3 / 2;
      border-radius: 10px;
      overflow: hidden;
      background: #000;
    }

    .howto {
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px 8px;
      font-size: 12.5px;
      color: #aeb8cc;
    }
    .howto .key {
      background: #1c2331;
      border: 1px solid #313c52;
      border-radius: 6px;
      padding: 3px 8px;
      white-space: nowrap;
    }
    .howto .key b { color: #e6e6e6; font-weight: 600; }

    footer {
      font-size: 11.5px;
      color: #56607a;
      text-align: center;
    }

    .ca {
      margin: 6px 0 0;
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: 0.3px;
      text-align: center;
      word-break: break-all;
      background: linear-gradient(90deg, #7c3aed, #a855f7, #d8b4fe, #c084fc);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }
  </style>
</head>
<body>
  <header>
    <h1>Pokemon Emerald: AI Slop</h1>
    <p class="tag">A ROM hack demo &middot; plays right in your browser</p>
  </header>

  <div class="card">
    <div id="game"></div>
    <div class="howto">
      <span class="key">Click <b>START GAME</b> to begin</span>
      <span class="key"><b>Arrow keys</b> Move</span>
      <span class="key"><b>Z</b> A button</span>
      <span class="key"><b>X</b> B button</span>
      <span class="key"><b>Enter</b> Start</span>
      <span class="key"><b>Shift</b> Select</span>
      <span class="key"><b>A / S</b> L / R</span>
    </div>
  </div>

  <footer>Built on pokeemerald-expansion &middot; pret &amp; RHH</footer>
  <p class="ca">CA: 8q5sVUV3Q2ELr4EAKcqqNf2DVgPQWS1u3PN3iLTqpump</p>

  <script>
    window.EJS_player = "#game";
    window.EJS_core = "gba";
    window.EJS_gameUrl = "pokeemerald.gba";
    window.EJS_gameName = "Pokemon Emerald: AI Slop";
    window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
    window.EJS_startOnLoaded = false;
  </script>
  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
